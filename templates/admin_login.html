<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELOCE Admin</title><style>
body{margin:0;background:#111;font-family:Arial;display:grid;place-items:center;min-height:100vh}.box{width:360px;max-width:90%;background:#fff;padding:32px}h1 span{color:#d60000}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}button{background:#111;color:#fff;border:0;cursor:pointer}.err{color:#d60000;font-weight:bold}</style></head><body><div class="box"><h1>VELOCE <span>ADMIN</span></h1>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>LOGIN</button></form></div></body></html>
